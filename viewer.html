<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EZRefill | Model inspection</title><link rel="icon" href="/favicon.ico" sizes="32x32"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<style>body{margin:0;font:14px system-ui;background:#eef0f4;color:#141519}#viewer{position:fixed;inset:0}aside{position:fixed;left:24px;top:24px;padding:20px;background:#ffffffec;border:1px solid #ddd;border-radius:12px;max-width:280px}h1{font-size:18px;margin:0 0 12px}label{display:block;margin:12px 0}select,input{max-width:100%;width:240px}#status{font-size:12px;line-height:1.5}a{color:#1760d8}button{margin-top:12px;padding:8px 12px}</style></head><body><div id="viewer"></div><aside><h1>Model inspection</h1><p>Independent glTF viewer. Drag to orbit; scroll to zoom.</p><label>Model<select id="model"><option value="hero-portable">Phone · portable</option><option value="hero-desktop">Phone · desktop</option><option value="hero-mobile">Phone · mobile</option><option value="airpods-portable">AirPods · portable</option><option value="airpods-desktop">AirPods · desktop</option><option value="airpods-mobile">AirPods · mobile</option><option value="accessories-portable">Accessories · portable</option><option value="accessories-desktop">Accessories · desktop</option><option value="accessories-mobile">Accessories · mobile</option><option value="connectivity-portable">SIM / eSIM · portable</option><option value="connectivity-desktop">SIM / eSIM · desktop</option><option value="connectivity-mobile">SIM / eSIM · mobile</option><option value="activations-mobile">Activations</option><option value="topups-mobile">Top-ups</option><option value="phone-help-mobile">Phone help</option></select></label><label>Assembly animation<input type="range" id="progress" min="0" max="1" step="0.001" value="0"></label><label>Background<select id="background"><option value="#eef0f4">Light</option><option value="#11141b">Dark</option></select></label><p id="status">Loading model…</p><a href="/">Return to scroll demo</a></aside><script type="module" src="/src/viewer.ts"></script></body></html>
